<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="погода, приложение погоды, Беларусь">
    <meta name="description" content="Приложение для отображения текущей погоды в Беларуси">
    <meta name="robots" content="index, follow">
    <link rel="stylesheet" href="styles/normalize.css">
    <link rel="stylesheet" href="styles/main.css">
    <link rel="icon" href="images/logo.png" type="image/x-icon">
    <title>Приложение погоды</title>
</head>
<body>
    <header>
        <div class="container">
            <div class="logo">
                <img src="images/logo.png" alt="Логотип приложения погоды">
            </div>
            <nav>
                <ul class="nav-list">
                    <li class="nav-item">
                        <a href="https://openweathermap.org/" target="_blank">API погоды</a>
                    </li>
                    <li class="nav-item">
                        <a href="https://learn.javascript.ru/" target="_blank">Изучить JavaScript</a>
                    </li>
                    <li class="nav-item">
                        <a href="https://git-scm.com/book/ru/v2" target="_blank">Технология Git</a>
                    </li>
                    <li class="nav-item">
                        <a href="https://github.com/Giller0102" target="_blank">Мой GitHub</a>
                    </li>
                    <li class="nav-item">
                        <a href="https://t.me/gil_ler" target="_blank">Мой Telegram</a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <div class="search" id="search-section">
            <div class="container">
                <h1>Погода в Беларуси</h1>
                <div class="search-form-wrapper">
                    <form class="search-form" id="search-form">
                        <img src="images/search-icon.png" alt="Поиск">
                        <input type="text" placeholder="Введите город..." class="search-input" id="search-input">
                        <button type="submit" class="button" id="search-btn">Найти</button>
                    </form>
                </div>
            </div>
        </div>
        <div class="search_result">
            <div class="container">
                <h2>Результаты поиска</h2>
                <img src="images/spinner.png" alt="Загрузка" id="loading-spinner" class="hidden">
                <div class="search_result-wrapper" id="weather-result">
                </div>
                <div id="error-message" class="hidden"></div>
            </div>
        </div>
    </main>
    <footer>
        <div class="container">
            <div class="logo">
                <img src="images/logo.png" alt="Логотип приложения погоды">
            </div>
            <nav>
                <ul class="nav-list">
                    <li class="nav-item">
                        <a href="https://openweathermap.org/" target="_blank">API погоды</a>
                    </li>
                    <li class="nav-item">
                        <a href="https://learn.javascript.ru/" target="_blank">Изучить JavaScript</a>
                    </li>
                    <li class="nav-item">
                        <a href="https://git-scm.com/book/ru/v2" target="_blank">Технология Git</a>
                    </li>
                    <li class="nav-item">
                        <a href="https://github.com/Giller0102" target="_blank">Мой GitHub</a>
                    </li>
                    <li class="nav-item">
                        <a href="https://t.me/gil_ler" target="_blank">Мой Telegram</a>
                    </li>
                </ul>
            </nav>
        </div>
    </footer>
    <script src="scripts/config.js"></script>
    <script defer src="scripts/app.js"></script>
</body>
</html>
